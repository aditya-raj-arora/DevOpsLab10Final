apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-system               
spec:
  replicas: 2                        
  selector:
    matchLabels:
      app: traffic-system              
  template:
    metadata:
      labels:
        app: traffic-system          
    spec:
      containers:
        - name: traffic-system         
          image: adityarajarora123/traffic-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:              
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-system-service
spec:
  type: NodePort
  selector:
    app: traffic-system                
  ports:
    - port: 80                         
      targetPort: 80                   
      nodePort: 30100                   # browser: http://localhost:30085  (30000-32767, unused)
