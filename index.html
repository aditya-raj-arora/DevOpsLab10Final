<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CHANGE: page title -->
    <title>College Notice Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
            line-height: 1.5;
        }

        header {
            background: #0b3d91;
            color: #fff;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
        }

        header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: .9;
            margin-top: 6px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 16px;
        }

        h3.section {
            font-size: 1.3rem;
            margin: 24px 0 12px;
            border-left: 5px solid #f59e0b;
            padding-left: 10px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
        }

        .card .date {
            font-size: .85rem;
            color: #6b7280;
        }

        .card h4 {
            margin: 4px 0;
        }

        .badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            font-size: .75rem;
            padding: 2px 8px;
            border-radius: 999px;
        }

        form {
            background: #fff;
            border-radius: 8px;
            padding: 18px;
            display: grid;
            gap: 10px;
        }

        label {
            font-weight: 600;
            font-size: .9rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        button {
            background: #0b3d91;
            color: #fff;
            border: 0;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        #thanks {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #6b7280;
            font-size: .9rem;
        }

        .version {
            font-size: .8rem;
            color: #9ca3af;
        }
        .Red{
            color: red;
        }
        .High{
            color: red;
        }
        .Yellow{
            color:yellow;
        }
        .Medium{
            color:yellow;
        }
        .Green{
            color:lightgreen;
        }
        .Low{
            color:lightgreen
        }
        .alert{
            background: orangered;
    color: white;
    text-align: center;
        }
    </style>
</head>

<body>
    <!-- CHANGE: college / company / hospital name and department -->
    <header>

    <!-- CHANGE: contact information -->

        <p>trafficIndia@india.gov.in · +91 8429231104</p>
        <p class="version">Version 1.0</p>
    </footer>

        const s = document.getElementById("database");
        var data = [
            {

            },
        ]
        var st = "";
        for(i=0;i<data.length;i++){
            st+=`<div class="card">
            <div>Intersection 1</div>
            <table>
                <tr>
                    <td>ID</td>
                    <td>`+data[i]['ID']+`</td>
                </tr>
                <tr>
                    <td>Location</td>
                    <td>`+data[i]['Loc']+`</td>
                </tr>
                <tr>

                    <td>`+data[i]['Count']+`</td>
                </tr>
                <tr>
                    <td>Avg Wait Time</td>
                    <td>`+data[i]['time']+`sec</td>
                </tr>
                <tr>

                    <td class="`+data[i]['signal']+`">`+data[i]['signal']+`</td>
                </tr>
                <tr>
                    <td>Congestion Level</td>
                    <td class="`+data[i]['level']+`">`+data[i]['level']+`</td>
                </tr>
            </table>
            `;
            if(data[i]['time']>120){
                st+=`<div class="alert">TOO MUCH CONGESTION</div>`
            }
            st+=`
        </div>`
        }
        s.innerHTML+=st;
    </script>
    
</body>

</html>
